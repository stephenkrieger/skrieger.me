<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concert Tracker — Stephen Krieger</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="back-link">&larr; Home</a>
      <h1>Concert Tracker</h1>
      <p class="subtitle">Upcoming shows within 150 miles of Richmond, VA</p>
      <div class="artists-header">
        <p class="artists-list" id="artists-list"></p>
        <button class="edit-artists-btn" id="edit-artists-btn">Edit Artists</button>
      </div>
    </header>

    <div class="artist-panel" id="artist-panel">
      <div class="artist-search-wrapper">
        <input type="text" id="artist-search" class="artist-search" placeholder="Search for an artist...">
        <div class="search-results" id="search-results"></div>
      </div>
      <div class="tracked-artists" id="tracked-artists"></div>
    </div>

    <div id="events">
      <div class="loading">Loading upcoming events&hellip;</div>
    </div>

    <footer>
      <p>Powered by the <a href="https://developer.ticketmaster.com/" target="_blank" rel="noopener">Ticketmaster API</a></p>
    </footer>
  </div>

  <script src="/js/concerts.js"></script>
</body>
</html>
