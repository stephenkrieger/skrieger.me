<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concert Tracker — Stephen Krieger</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h2 class="sidebar-heading">Your Artists</h2>
      <div class="artist-search-wrapper">
        <input type="text" id="artist-search" class="artist-search" placeholder="Search to add...">
        <div class="search-results" id="search-results"></div>
      </div>
      <p class="search-hint">Type to search Ticketmaster</p>
      <hr class="sidebar-divider">
      <h2 class="sidebar-heading">Tracking</h2>
      <div class="tracked-artists" id="tracked-artists"></div>

      <hr class="sidebar-divider">
      <h2 class="sidebar-heading">Location</h2>
      <div class="location-wrapper">
        <input type="text" id="location-input" class="artist-search" placeholder="City, State">
        <button id="location-set" class="location-set-btn">Set</button>
      </div>
      <p class="location-current" id="location-current"></p>

      <hr class="sidebar-divider">
      <h2 class="sidebar-heading">Distance</h2>
      <div class="radius-wrapper">
        <input type="range" id="radius-slider" min="25" max="300" step="25" value="150">
        <span class="radius-value" id="radius-value">150 mi</span>
      </div>
    </aside>

    <main class="main-content">
      <header>
        <a href="/" class="back-link">&larr; Home</a>
        <h1>Concert Tracker</h1>
        <p class="subtitle" id="subtitle">Upcoming shows within 150 miles of Richmond, VA</p>
      </header>

      <div id="events">
        <div class="loading">Loading upcoming events&hellip;</div>
      </div>

      <footer>
        <p>Powered by the <a href="https://developer.ticketmaster.com/" target="_blank" rel="noopener">Ticketmaster API</a></p>
      </footer>
    </main>
  </div>

  <script src="/js/concerts.js"></script>
</body>
</html>
